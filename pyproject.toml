[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-loan-default-analysis"
version = "1.0.0"
description = "Credit risk, vintage performance, expected loss and default probability analysis of Lending Club loans."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "jupyter>=1.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "kaggle>=1.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
